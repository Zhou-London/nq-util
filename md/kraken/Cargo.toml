[package]
name = "kraken"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
futures-util = "0.3.34"
hmac = "0.13.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "charset", "http2", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "signal", "net"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
